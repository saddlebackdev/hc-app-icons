name: Publish to npm

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: corepack enable && yarn install --frozen-lockfile

      - name: Skip if version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "hc-app-icons@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish
        # Do not set NODE_AUTH_TOKEN — OIDC trusted publishing handles auth.
