name: Build

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: corepack enable && yarn install --frozen-lockfile

      # `prepare` runs the build during install; run it explicitly so failures are clear.
      - run: yarn build
